name: 운동일 알림 발송

on:
  schedule:
    # 매일 KST 오전 8시 (UTC 전날 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 오늘 요일 태그 계산 (KST)
        id: day
        run: |
          # KST = UTC+9, 현재 UTC 시각에 9시간 추가
          DAY=$(TZ=Asia/Seoul date +%a | tr '[:upper:]' '[:lower:]')
          # date +%a → mon, tue, wed, thu, fri, sat, sun
          echo "tag=workout_${DAY}" >> $GITHUB_OUTPUT
          echo "오늘 KST 요일 태그: workout_${DAY}"

      - name: OneSignal 태그 필터 알림 발송
        run: |
          TAG="${{ steps.day.outputs.tag }}"
          HTTP=$(curl -s -o /tmp/res.json -w "%{http_code}" \
            -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"app_id\": \"8b8922ed-cb3d-464e-8f51-3c442de20a69\",
              \"filters\": [
                {\"field\": \"tag\", \"key\": \"${TAG}\", \"relation\": \"=\", \"value\": \"1\"}
              ],
              \"headings\": {\"ko\": \"운동일지 💪\"},
              \"contents\": {\"ko\": \"오늘 운동하는 날이에요! 기록하러 가볼까요?\"}
            }")
          cat /tmp/res.json
          echo "HTTP Status: $HTTP"
          [ "$HTTP" = "200" ] && echo "✅ 알림 발송 성공" || (echo "❌ 알림 발송 실패" && exit 1)
