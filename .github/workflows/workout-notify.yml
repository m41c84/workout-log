name: 운동일 알림 발송

on:
  schedule:
    # KST 오전 8시 기준 (UTC+9 → UTC 전날 23:00)
    # 기본값: 매주 월·수·금 오전 8시
    # 요일 변경: 0=일 1=월 2=화 3=수 4=목 5=금 6=토
    # 예) 매일: '0 23 * * *'  /  화·목·토: '0 23 * * 1,3,5'
    - cron: '0 23 * * 0,2,4'
  workflow_dispatch: # 대시보드에서 수동 테스트 가능

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: OneSignal 푸시 알림 발송
        run: |
          HTTP=$(curl -s -o /tmp/res.json -w "%{http_code}" \
            -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "app_id": "8b8922ed-cb3d-464e-8f51-3c442de20a69",
              "included_segments": ["All"],
              "headings": {"ko": "운동일지 💪"},
              "contents": {"ko": "오늘 운동하는 날이에요! 기록하러 가볼까요?"}
            }')
          cat /tmp/res.json
          echo "HTTP Status: $HTTP"
          [ "$HTTP" = "200" ] && echo "✅ 알림 발송 성공" || (echo "❌ 알림 발송 실패" && exit 1)
